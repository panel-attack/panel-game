name: PR Checks

on:
  pull_request:
    paths:
      - '**.lua'
      - '.luarc.json'
      - '.github/workflows/pr-checks.yml'
  push:
    branches: [beta]

jobs:
  lua-diagnostics:
    name: Lua Language Server Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI Lua config
        run: |
          # Copy base config and replace all "Opened" with "None" for CI
          sed 's/"Opened"/"None"/g' .luarc.json > .luarc.ci.json
          echo "Generated .luarc.ci.json for CI (all 'Opened' diagnostics disabled)"

      - name: Type Check and Lint
        id: typecheck
        uses: mrcjkb/lua-typecheck-action@v0
        with:
          directories: .
          configpath: .luarc.ci.json
          checklevel: Information
        continue-on-error: true

      - name: Format diagnostics Output
        if: steps.typecheck.outcome == 'failure'
        run: |
          echo "## ❌ Lua Language Server Diagnostics Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "check.json" ]; then
            # Count total diagnostics
            TOTAL=$(jq '[.[] | length] | add // 0' check.json)
            echo "Found **$TOTAL** diagnostic issue(s)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Show all diagnostics
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>View Diagnostics</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            jq -r 'to_entries[] | .key as $file | .value[] | "**\($file):\(.range.start.line + 1)** - \(.message) `[\(.code)]`"' check.json >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No check.json file found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Debug: Listing files in current directory:" >> $GITHUB_STEP_SUMMARY
            ls -la >> $GITHUB_STEP_SUMMARY
          fi

          exit 1

  love2d-tests:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb

      - name: Cache Love2D binary
        id: cache-love
        uses: actions/cache@v4
        with:
          path: ~/love2d
          key: love2d-12.0-${{ hashFiles('.github/love-version.txt') }}

      - name: Download Love2D
        if: steps.cache-love.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/love2d
          curl -L "https://github.com/JamesVanBoxtel/panel-game/releases/download/love2d-12.0/love-12.0-linux-x86_64.tar.gz" \
            -o /tmp/love.tar.gz
          tar -xzf /tmp/love.tar.gz -C ~/love2d

      - name: Make Love2D executable
        run: chmod +x ~/love2d/love.AppImage

      - name: Run Tests
        id: tests
        run: |
          set -o pipefail
          xvfb-run --auto-servernum ~/love2d/love.AppImage ./testLauncher.lua 2>&1 | tee test-output.log
        timeout-minutes: 10
        continue-on-error: true

      - name: Format Test Failures
        if: steps.tests.outcome == 'failure'
        run: |
          echo "## ❌ Love2D Tests Failed"
          echo "## ❌ Love2D Tests Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "test-output.log" ]; then
            # Show test failures
            if grep -q -E "Test failed:|Tests failed!" test-output.log; then
              echo "### Failed Tests:"
              echo "### Failed Tests:" >> $GITHUB_STEP_SUMMARY
              grep -E "Test failed:|Tests failed!" test-output.log | while read -r line; do
                echo "- $line"
                echo "- $line" >> $GITHUB_STEP_SUMMARY
              done
              echo "" >> $GITHUB_STEP_SUMMARY
            else
              echo "No test failure patterns found in log"
            fi

            # Show ERROR level logs for context
            if grep -q "ERROR:" test-output.log; then
              echo "### Error Details:"
              echo "### Error Details:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep "ERROR:" test-output.log | tail -20 | tee -a $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "No ERROR patterns found in log"
            fi
          else
            echo "⚠️ No test output log found"
            echo "⚠️ No test output log found" >> $GITHUB_STEP_SUMMARY
            echo "Listing current directory:"
            ls -la
          fi

          exit 1

      - name: Upload Test Logs on Failure
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            *.log
            test-output.log
