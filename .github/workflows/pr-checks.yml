name: PR Checks

on:
  pull_request:
    paths:
      - '**.lua'
      - '.luarc.json'
      - '.github/workflows/pr-checks.yml'
  push:
    branches: [beta]

jobs:
  lua-diagnostics:
    name: Lua Language Server Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type Check and Lint
        id: typecheck
        uses: mrcjkb/lua-typecheck-action@v0
        with:
          directories: .
          configpath: .luarc.json
          checklevel: Information
        continue-on-error: true

      - name: Format diagnostics output
        if: steps.typecheck.outcome == 'failure'
        run: |
          echo "## ❌ Lua Language Server Diagnostics Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following issues were found:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse and format errors from check.json if it exists
          if [ -f "check.json" ]; then
            jq -r '.[] | "### \(.uri | split("/") | last)\n**Line \(.range.start.line + 1)**: \(.message)\nCode: `\(.code)`\n"' check.json >> $GITHUB_STEP_SUMMARY
          fi

          exit 1

  love2d-tests:
    name: Love2D Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb

      - name: Cache Love2D binary
        id: cache-love
        uses: actions/cache@v4
        with:
          path: ~/love2d
          key: love2d-12.0-${{ hashFiles('.github/love-version.txt') }}

      - name: Download Love2D 12.0
        if: steps.cache-love.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/love2d
          curl -L "https://github.com/JamesVanBoxtel/panel-game/releases/download/love2d-12.0/love-12.0-linux-x86_64.tar.gz" \
            -o /tmp/love.tar.gz
          tar -xzf /tmp/love.tar.gz -C ~/love2d

      - name: Make Love2D executable
        run: chmod +x ~/love2d/love.AppImage

      - name: Run tests
        run: xvfb-run --auto-servernum ~/love2d/love.AppImage ./testLauncher.lua
        timeout-minutes: 10

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: "*.log"
