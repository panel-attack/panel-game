name: PR Checks

# Both jobs are required checks on beta, so they run on every pull request and pass straight away when it changes nothing
# they check. A path filter on the trigger would leave them never reporting, and the pull request blocked.
on:
  pull_request:
  push:
    branches: [beta]

permissions:
  contents: read
  pull-requests: read

env:
  # One extended regex per line. A pull request runs the diagnostics when it changes a file matching one of these...
  DIAGNOSTICS_PATHS: |
    \.lua$
    ^\.luarc\.json$
    ^\.github/workflows/pr-checks\.yml$
  # ...and skips the tests only when every file it changes matches one of these, since the tests also read data and assets.
  TESTS_SKIP_PATHS: |
    \.md$
    ^docs/
    ^\.gitignore$
    ^COPYING
    ^\.vscode/
    ^VsCodeStyleConfig\.lua-format$
    ^\.luarc\.json$
    ^build\.sh$
    ^\.github/workflows/(canary-release|create-love-archive)\.yml$

jobs:
  lua-diagnostics:
    name: Lua Language Server Diagnostics
    runs-on: ubuntu-latest
    steps:
      # shared with the test job below, and run before checkout so a skip doesn't download the repository
      - &findChecks
        name: Find what to check
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # a blank line would be an empty pattern, which matches every file
          patterns() { printf '%s\n' "$1" | grep -v -e '^[[:space:]]*$'; }
          diagnostics=true
          tests=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            files="$RUNNER_TEMP/changed-files.txt"
            # a renamed file lists its old path too, so moving a Lua file to another name still counts as changing it
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$files"
            cat "$files"
            # the API lists at most 3000 files, so a pull request that large is checked in full
            if [ "$(wc -l < "$files")" -lt 3000 ]; then
              if ! grep -q -E -f <(patterns "$DIAGNOSTICS_PATHS") "$files"; then
                diagnostics=false
              fi
              if ! grep -q -v -E -f <(patterns "$TESTS_SKIP_PATHS") "$files"; then
                tests=false
              fi
            fi
          fi
          echo "diagnostics=$diagnostics tests=$tests"
          echo "diagnostics=$diagnostics" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.changes.outputs.diagnostics == 'true'

      - name: Type Check and Lint
        id: typecheck
        if: steps.changes.outputs.diagnostics == 'true'
        uses: mrcjkb/lua-typecheck-action@v0
        with:
          directories: .
          configpath: .luarc.json
          checklevel: Information
        continue-on-error: true
        env:
          NO_COLOR: 1

      - name: Publish diagnostics annotations
        if: steps.typecheck.outcome == 'failure'
        run: |
          python3 <<'PYTHON'
          import json
          import sys
          import os
          from urllib.parse import unquote, urlparse

          # LSP severity → GitHub annotation level mapping
          SEVERITY_MAP = {
              1: 'error',    # Error
              2: 'warning',  # Warning
              3: 'notice',   # Information
              4: 'notice'    # Hint
          }

          try:
              with open('check.json') as f:
                  diagnostics = json.load(f)
          except FileNotFoundError:
              print('::error::check.json not found')
              sys.exit(1)
          except json.JSONDecodeError:
              print('::error::check.json is not valid JSON')
              sys.exit(1)

          # Show diagnostics inline on the PR's "Files changed" tab rather than only on the run page.
          # lua-language-server reports absolute file:// URIs, but GitHub only attaches annotations
          # to the diff when the file path is relative to the repo root.
          workspace = os.environ.get('GITHUB_WORKSPACE', os.getcwd())
          def relative_path(uri):
              path = unquote(urlparse(uri).path) if uri.startswith('file://') else uri
              return os.path.relpath(os.path.normpath(path), workspace)

          diagnostics = {relative_path(uri): issues for uri, issues in diagnostics.items()}

          total_count = 0
          severity_counts = {'error': 0, 'warning': 0, 'notice': 0}

          # Emit annotations for all diagnostics
          for file_path, issues in diagnostics.items():
              for issue in issues:
                  severity_level = issue.get('severity', 2)
                  severity = SEVERITY_MAP.get(severity_level, 'warning')

                  # LSP uses 0-indexed lines/columns, GitHub uses 1-indexed
                  line = issue['range']['start']['line'] + 1
                  col = issue['range']['start']['character'] + 1

                  message = issue['message']
                  code = issue.get('code', 'unknown')

                  # Emit GitHub workflow command
                  print(f"::{severity} file={file_path},line={line},col={col}::{message} [{code}]")

                  total_count += 1
                  severity_counts[severity] += 1

          # Print summary to step output
          print(f"\n📊 Emitted {total_count} annotations:", file=sys.stderr)
          print(f"  Errors: {severity_counts['error']}", file=sys.stderr)
          print(f"  Warnings: {severity_counts['warning']}", file=sys.stderr)
          print(f"  Notices: {severity_counts['notice']}", file=sys.stderr)

          if total_count == 0:
              print('::warning::lua-language-server reported failure but no diagnostics were parsed')

          # Write summary for PR comment
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a') as summary:
                  summary.write('## ❌ Lua Language Server Diagnostics Failed\n\n')
                  summary.write(f'Found **{total_count}** diagnostic issue(s)\n\n')
                  summary.write(f'- Errors: **{severity_counts["error"]}**\n')
                  summary.write(f'- Warnings: **{severity_counts["warning"]}**\n')
                  summary.write(f'- Notices: **{severity_counts["notice"]}**\n\n')

                  # Detailed diagnostics in collapsible section
                  summary.write('<details>\n')
                  summary.write('<summary>View All Diagnostics</summary>\n\n')

                  for file_path, issues in diagnostics.items():
                      for issue in issues:
                          line = issue['range']['start']['line'] + 1
                          message = issue['message']
                          code = issue.get('code', 'unknown')
                          summary.write(f'**{file_path}:{line}** - {message} `[{code}]`\n')

                  summary.write('\n</details>\n')

          PYTHON
          exit 1

  love2d-tests:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - *findChecks

      - uses: actions/checkout@v4
        if: steps.changes.outputs.tests == 'true'

      - name: Install dependencies
        if: steps.changes.outputs.tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb

      - name: Cache Love2D binary
        id: cache-love
        if: steps.changes.outputs.tests == 'true'
        uses: actions/cache@v4
        with:
          path: ~/love2d
          key: love2d-12.0-${{ hashFiles('.github/love-version.txt') }}

      - name: Download Love2D
        if: steps.changes.outputs.tests == 'true' && steps.cache-love.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/love2d
          curl -fL "https://github.com/panel-attack/panel-game/releases/download/love2d-12.0/love-12.0-linux-x86_64.tar.gz" \
            -o /tmp/love.tar.gz
          tar -xzf /tmp/love.tar.gz -C ~/love2d
          # Rename the AppImage to a consistent name for easier reference
          mv ~/love2d/*.AppImage ~/love2d/love.AppImage

      - name: Make Love2D executable
        if: steps.changes.outputs.tests == 'true'
        run: chmod +x ~/love2d/love.AppImage

      - name: Run Tests
        id: tests
        if: steps.changes.outputs.tests == 'true'
        run: |
          set -o pipefail
          xvfb-run --auto-servernum ~/love2d/love.AppImage ./testLauncher.lua 2>&1 | tee test-output.log
        timeout-minutes: 10
        continue-on-error: true

      - name: Format Test Failures
        if: steps.tests.outcome == 'failure'
        run: |
          echo "## ❌ Love2D Tests Failed"
          echo "## ❌ Love2D Tests Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "test-output.log" ]; then
            # Show test failures
            if grep -q -E "Test failed:|Tests failed!" test-output.log; then
              echo "### Failed Tests:"
              echo "### Failed Tests:" >> $GITHUB_STEP_SUMMARY
              grep -E "Test failed:|Tests failed!" test-output.log | while read -r line; do
                echo "- $line"
                echo "- $line" >> $GITHUB_STEP_SUMMARY
              done
              echo "" >> $GITHUB_STEP_SUMMARY
            else
              echo "No test failure patterns found in log"
            fi

            # Show ERROR level logs for context
            if grep -q "ERROR:" test-output.log; then
              echo "### Error Details:"
              echo "### Error Details:" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep "ERROR:" test-output.log | tail -20 | tee -a $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            else
              echo "No ERROR patterns found in log"
            fi
          else
            echo "⚠️ No test output log found"
            echo "⚠️ No test output log found" >> $GITHUB_STEP_SUMMARY
            echo "Listing current directory:"
            ls -la
          fi

          exit 1

      - name: Upload Test Logs on Failure
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            *.log
            test-output.log
